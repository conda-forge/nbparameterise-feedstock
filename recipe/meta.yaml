{% set name = "nbparameterise" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0cb314efc150810c3dc87c0bd5aae78f5d04ab76ce594189acc007fbdb608b2a

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.8
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=3.8
    - nbconvert
    - astcheck >=0.3

test:
  imports:
    - nbparameterise

about:
  home: https://github.com/takluyver/nbparameterise
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: This is a tool to run notebooks with input values.
  doc_url: https://github.com/takluyver/nbparameterise
  dev_url: https://github.com/takluyver/nbparameterise

extra:
  recipe-maintainers:
    - kmuehlbauer
